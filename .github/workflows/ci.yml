name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # یک Postgres موقت: هم migrationها را از صفر امتحان می‌کند، هم build
    # (که sitemap در آن از دیتابیس می‌خواند) بدون دیتابیس واقعی کار می‌کند
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jobboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # مقدارهای ساختگی فقط برای CI
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/jobboard
      BETTER_AUTH_SECRET: ci-placeholder-secret-ci-placeholder-secret
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

      - name: Apply migrations to a fresh database
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build